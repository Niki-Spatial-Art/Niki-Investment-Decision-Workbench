name: Portfolio Sleeve Backtest Weekly

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron is UTC: Friday 09:45 UTC = Beijing Friday 17:45.
    - cron: '45 9 * * 5'

permissions:
  contents: write

jobs:
  portfolio-sleeve-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Run layered portfolio research
        run: python tools/portfolio_sleeve_backtest.py

      - name: Persist public backtest snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/portfolio_sleeve_backtest_latest.json
          git diff --cached --quiet || git commit -m "chore: update portfolio sleeve backtest"
          git push

      - name: Upload backtest artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-sleeve-backtest-${{ github.run_id }}
          path: reports/portfolio_sleeve_backtest_latest.json
          if-no-files-found: warn
          retention-days: 90
