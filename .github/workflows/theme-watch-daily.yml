name: Theme Watch Daily

on:
  workflow_dispatch:
    inputs:
      send_email:
        description: Send the configured QQ email after building the report
        required: true
        default: true
        type: boolean
  schedule:
    # GitHub Actions cron is UTC: 08:00 UTC = Beijing 16:00 on weekdays.
    # 收盘后发送主题监控日报，脚本在非交易日自动跳过。
    - cron: '0 8 * * 1-5'

permissions:
  contents: write

concurrency:
  # 与 whole-market-watch-daily、premarket-brief 共用同一个锁，串行化所有写 main 的每日任务
  group: daily-report-push-${{ github.ref }}
  cancel-in-progress: false

jobs:
  theme-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # Tencent qfq K-line is the available fallback when optional A-share packages are absent.
      - run: pip install -r requirements.txt

      - name: Build and send theme watch report
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.send_email }}" != "true" ]; then
            python tools/theme_watch_report.py
          else
            python tools/theme_watch_report.py --email
          fi
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          THEME_WATCH_RECIPIENT_EMAIL: ${{ secrets.THEME_WATCH_RECIPIENT_EMAIL }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}

      - name: Persist public history on A-share trading days
        run: |
          if ! python -c "import json; raise SystemExit(0 if json.load(open('reports/theme_watch_latest.json', encoding='utf-8')).get('a_share_trading_day') else 1)"; then
            echo "A-share is closed; public history and email were skipped."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/theme_watch_latest.json reports/theme_watch_history.jsonl
          bash tools/safe_push.sh "chore: update public theme watch snapshot"

      - name: Upload daily theme watch artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: theme-watch-${{ github.run_id }}
          path: reports/theme_watch_*
          if-no-files-found: warn
          retention-days: 30
