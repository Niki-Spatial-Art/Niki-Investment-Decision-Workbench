name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  python-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Compile Python modules
        run: python -m compileall -q monitor.py ai_client.py emailer.py tools connectors workflows

      - name: Pre-publish privacy check
        run: python tools/pre_publish_check.py --include-untracked

      - name: Workflow timezone guard
        run: python tools/check_workflow_timezones.py

      - name: Offline action-card demo
        run: python workflows/demo_quant_research.py
        env:
          MONITOR_SEND_EMAIL: "false"
