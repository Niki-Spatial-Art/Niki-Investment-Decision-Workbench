name: Review Yearly

on:
  workflow_dispatch:
  schedule:
    # Beijing Dec 31 17:30 annual review, pinned with timezone.
    - cron: '30 17 31 12 *'
      timezone: Asia/Shanghai

permissions:
  contents: write

jobs:
  yearly-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Build yearly review and send email
        run: python tools/review_aggregator.py --period yearly --email
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}

      - name: Commit and push yearly review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reviews/yearly/
          git diff --cached --quiet || git commit -m "chore: yearly review $(date +%F)"
          git push
