name: Review Yearly

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron is UTC: Dec 31 09:30 UTC = Beijing Dec 31 17:30.
    - cron: '30 9 31 12 *'

permissions:
  contents: write

jobs:
  yearly-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Build yearly review and send email
        run: python tools/review_aggregator.py --period yearly --email
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}

      - name: Commit and push yearly review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reviews/yearly/
          bash tools/safe_push.sh "chore: yearly review $(date +%F)"
