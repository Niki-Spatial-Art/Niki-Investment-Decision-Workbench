name: Learning Intake

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron is UTC: Sunday 12:30 UTC = Beijing Sunday 20:30.
    - cron: '30 12 * * 0'

jobs:
  learning-intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Build and email learning intake report
        run: python tools/learning_intake.py --sources examples/learning_sources.json --output reports/learning_intake.md --email
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          SMTP_SERVER: smtp.qq.com
          SMTP_PORT: 587

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: learning-intake-report
          path: reports/learning_intake.md
