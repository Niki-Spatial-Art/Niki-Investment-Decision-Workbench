name: A-share Market Watch

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron is UTC: 01:10/07:35 UTC = Beijing 09:10/15:35.
    # 职责边界：本工作流只做"原始市场快照存档"(供雷达安全闸门读取)，不发邮件、不做动作卡。
    # 收盘日报与邮件由 whole-market-watch-daily.yml(15:40/15:50/16:00) 负责，二者不重叠。
    - cron: '10 1 * * 1-5'
    - cron: '35 7 * * 1-5'

permissions:
  contents: read

jobs:
  market-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt -r requirements-a-stock.txt

      - name: Create public market snapshot
        run: >-
          python tools/a_stock_radar_snapshot.py
          --codes 510300,510500,512100,512880,588000,518880
          --output data/a_stock_market_watch.json

      - name: Upload market snapshot
        uses: actions/upload-artifact@v4
        with:
          name: a-share-market-watch
          path: data/a_stock_market_watch.json
          if-no-files-found: error
          retention-days: 7
