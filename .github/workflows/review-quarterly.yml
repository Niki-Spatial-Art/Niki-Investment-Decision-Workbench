name: Review Quarterly

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron does not support "L" (last day of month).
    # Run at 17:30 Beijing time on quarter-end candidate days, then skip unless it is actually quarter-end.
    - cron: '30 9 28-31 3,6,9,12 *'

permissions:
  contents: write

jobs:
  quarterly-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check quarterly review window
        id: review-window
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "beijing_date=manual" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          today = datetime.now(ZoneInfo("Asia/Shanghai")).date()
          is_quarter_month = today.month in {3, 6, 9, 12}
          is_month_end = (today + timedelta(days=1)).month != today.month
          should_run = is_quarter_month and is_month_end
          print(f"should_run={'true' if should_run else 'false'}")
          print(f"beijing_date={today.isoformat()}")
          PY

      - uses: actions/checkout@v4
        if: steps.review-window.outputs.should_run == 'true'

      - uses: actions/setup-python@v5
        if: steps.review-window.outputs.should_run == 'true'
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt
        if: steps.review-window.outputs.should_run == 'true'

      - name: Build quarterly review and send email
        if: steps.review-window.outputs.should_run == 'true'
        run: python tools/review_aggregator.py --period quarterly --email
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}

      - name: Commit and push quarterly review
        if: steps.review-window.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reviews/quarterly/
          git diff --cached --quiet || git commit -m "chore: quarterly review $(date +%F)"
          git push
