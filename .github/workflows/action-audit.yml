name: Intraday Action Card Scan

on:
  workflow_dispatch:
    inputs:
      force_send:
        description: Force-send an intraday preview outside the guarded Beijing windows
        required: true
        default: false
        type: boolean
  schedule:
    # GitHub Actions cron is UTC. These entries are the UTC equivalents of
    # the Beijing A-share intraday checkpoints below. Do not write local
    # Beijing hours here; the script still validates actual Asia/Shanghai time.
    # 09:30, 10:00, 10:30, 11:00, 11:30, 13:00, 13:30, 14:00, 14:30, 14:55.
    # 注：14:55 为尾盘风险确认，15:00 已删除(与收盘复盘边界混淆)，尾盘只保留 14:55。
    - cron: '30 1 * * 1-5'   # Beijing 09:30
    - cron: '0 2 * * 1-5'    # Beijing 10:00
    - cron: '30 2 * * 1-5'   # Beijing 10:30
    - cron: '0 3 * * 1-5'    # Beijing 11:00
    - cron: '30 3 * * 1-5'   # Beijing 11:30
    - cron: '0 5 * * 1-5'    # Beijing 13:00
    - cron: '30 5 * * 1-5'   # Beijing 13:30
    - cron: '0 6 * * 1-5'    # Beijing 14:00
    - cron: '30 6 * * 1-5'   # Beijing 14:30
    - cron: '55 6 * * 1-5'   # Beijing 14:55

permissions:
  contents: read

jobs:
  action-cards:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt -r requirements-a-stock.txt

      - name: Scan market and send conditional action cards
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_send }}" = "true" ]; then
            python tools/send_workbench_email_preview.py --intraday --force
          else
            python tools/send_workbench_email_preview.py --intraday
          fi
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          INTRADAY_ACTION_CARD_MAX_CAPITAL: "20000"
