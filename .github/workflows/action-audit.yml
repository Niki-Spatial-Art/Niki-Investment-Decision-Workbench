name: Intraday Action Card Scan

on:
  workflow_dispatch:
    inputs:
      force_send:
        description: Force-send an intraday preview outside the guarded Beijing windows
        required: true
        default: false
        type: boolean
  schedule:
    # GitHub Actions cron is UTC. These entries are the UTC equivalents of
    # the Beijing A-share intraday checkpoints below. Do not write local
    # Beijing hours here; the script still validates actual Asia/Shanghai time.
    # Triggers are offset by 7 minutes to avoid GitHub's busy :00/:30 peaks.
    # The script maps each trigger back to its Beijing checkpoint and allows
    # at most 20 minutes of scheduler delay.
    # 注：14:55 为尾盘风险确认，15:00 已删除(与收盘复盘边界混淆)，尾盘只保留 14:55。
    - cron: '37 1 * * 1-5'   # Beijing checkpoint 09:30 (trigger 09:37)
    - cron: '7 2 * * 1-5'    # Beijing checkpoint 10:00 (trigger 10:07)
    - cron: '37 2 * * 1-5'   # Beijing checkpoint 10:30 (trigger 10:37)
    - cron: '7 3 * * 1-5'    # Beijing checkpoint 11:00 (trigger 11:07)
    - cron: '37 3 * * 1-5'   # Beijing checkpoint 11:30 (trigger 11:37)
    - cron: '7 5 * * 1-5'    # Beijing checkpoint 13:00 (trigger 13:07)
    - cron: '37 5 * * 1-5'   # Beijing checkpoint 13:30 (trigger 13:37)
    - cron: '7 6 * * 1-5'    # Beijing checkpoint 14:00 (trigger 14:07)
    - cron: '37 6 * * 1-5'   # Beijing checkpoint 14:30 (trigger 14:37)
    - cron: '57 6 * * 1-5'   # Beijing checkpoint 14:55 (trigger 14:57)

permissions:
  contents: read

concurrency:
  group: intraday-notifications-${{ github.ref }}
  cancel-in-progress: false

jobs:
  action-cards:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt -r requirements-a-stock.txt

      - name: Restore public notification state
        uses: actions/cache/restore@v4
        with:
          path: reports/intraday_notification_state.json
          key: intraday-state-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            intraday-state-v1-${{ github.ref_name }}-

      - name: Scan market and send conditional action cards
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_send }}" = "true" ]; then
            python tools/send_workbench_email_preview.py --intraday --force
          else
            python tools/send_workbench_email_preview.py --intraday
          fi
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          INTRADAY_ACTION_CARD_MAX_CAPITAL: "20000"

      - name: Preserve public notification state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: reports/intraday_notification_state.json
          key: intraday-state-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Preserve public run audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intraday-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/intraday_run_audit.jsonl
            reports/intraday_silent_log.jsonl
          if-no-files-found: ignore
          retention-days: 14
