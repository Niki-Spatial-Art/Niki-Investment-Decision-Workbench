name: Theme Price Study Weekly

on:
  workflow_dispatch:
    inputs:
      send_email:
        description: Send the configured QQ research email
        required: true
        default: true
        type: boolean
  schedule:
    # GitHub cron uses UTC. Beijing Friday 17:35, after the daily theme report.
    - cron: '35 9 * * 5'

permissions:
  contents: write

jobs:
  price-study:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Build and send price-condition study
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.send_email }}" != "true" ]; then
            python tools/theme_signal_backtest.py
          else
            python tools/theme_signal_backtest.py --email
          fi
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          THEME_WATCH_RECIPIENT_EMAIL: ${{ secrets.THEME_WATCH_RECIPIENT_EMAIL }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}

      - name: Persist public price-study snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/theme_backtest_latest.json
          git diff --cached --quiet || git commit -m "chore: update theme price study"
          git push

      - name: Upload weekly study artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: theme-price-study-${{ github.run_id }}
          path: reports/theme_backtest_latest.json
          if-no-files-found: warn
          retention-days: 90
